<!doctype html>
<title>NYCEats — extraction stream</title>
<style>
  :root {
    color-scheme: light dark;
    --line: color-mix(in srgb, currentColor 12%, transparent);
    --dim: color-mix(in srgb, currentColor 55%, transparent);
    --pos: #16a34a; --neg: #dc2626;
    font: 14.5px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  body { margin: 0; padding: 0 20px 64px; max-width: 760px; }
  header { position: sticky; top: 0; padding: 18px 0 12px;
           background: Canvas; border-bottom: 1px solid var(--line); z-index: 1;
           display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 14px; font-weight: 600; margin: 0; }
  .meta { color: var(--dim); font-size: 13px; margin-left: auto;
          font-variant-numeric: tabular-nums; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pos);
         display: inline-block; margin-right: 6px; }
  .dot.off { background: var(--neg); }

  article { padding: 14px 0; border-bottom: 1px solid var(--line); }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
  article.new { animation: in .45s ease both; }

  .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 640; }
  .res { color: var(--dim); font-size: 12.5px; }
  .chip { font-size: 11.5px; padding: 1px 7px; border-radius: 99px;
          border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .chip.p { color: var(--pos); border-color: color-mix(in srgb, var(--pos) 35%, transparent); }
  .chip.n { color: var(--neg); border-color: color-mix(in srgb, var(--neg) 35%, transparent); }
  .chip.avoid { color: var(--neg); border-color: var(--neg); font-weight: 600; }
  blockquote { margin: 7px 0 0; color: var(--dim); }
  .who { font-size: 12.5px; color: var(--dim); margin-top: 5px; }
  a { color: inherit; }
</style>
<header>
  <h1><span class="dot" id="dot"></span>extraction stream</h1>
  <span class="meta" id="meta">connecting…</span>
</header>
<main id="feed"></main>
<script>
const ASPECTS = ["food", "value", "service", "atmosphere", "wait"];
let cursor = null, seen = 0, first = true;

const esc = s => (s ?? "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

function card(m) {
  const chips = [];
  if (m.is_negated) chips.push(`<span class="chip avoid">avoid</span>`);
  for (const a of ASPECTS) {
    const v = m.aspects?.[a];
    if (v === null || v === undefined) continue;
    chips.push(`<span class="chip ${v >= 0 ? "p" : "n"}">${a} ${v > 0 ? "+" : ""}${v}</span>`);
  }
  for (const d of (m.dishes || []).slice(0, 3)) chips.push(`<span class="chip">${esc(d)}</span>`);
  for (const d of (m.descriptors || []).slice(0, 3)) chips.push(`<span class="chip">${esc(d)}</span>`);
  if (!m.is_firsthand) chips.push(`<span class="chip">hearsay</span>`);

  const resolved = m.resolved_key && m.resolved_key !== m.entity_key
    ? `<span class="res">→ ${esc(m.resolved_key)}</span>` : "";
  const body = esc((m.body || "").replace(/\s+/g, " ").slice(0, 260));

  const el = document.createElement("article");
  el.className = "new";
  el.innerHTML = `<div class="top"><span class="name">${esc(m.restaurant_raw)}</span>
      ${resolved}${chips.join("")}</div>
    <blockquote>${body}</blockquote>
    <div class="who">u/${esc(m.author)} · <a href="${esc(m.permalink)}" target="_blank"
      rel="noopener">${esc((m.thread_title || "").slice(0, 70))}</a></div>`;
  return el;
}

async function tick() {
  try {
    const url = "/api/latest" + (cursor ? "?after=" + cursor : "");
    const rows = await (await fetch(url)).json();
    if (rows.length) {
      cursor = Math.max(...rows.map(r => r.id));
      seen += rows.length;
      // API returns newest first; append oldest-first so the newest ends on top.
      for (const m of rows.slice().reverse()) feed.prepend(card(m));
      while (feed.children.length > 300) feed.lastChild.remove();
    }
    const p = await (await fetch("/api/progress")).json();
    dot.className = "dot" + (p.running ? "" : " off");
    meta.textContent = `${p.mentions.toLocaleString()} facts · `
      + `${p.extracted.toLocaleString()} comments · ${p.rate_per_min}/min`
      + (p.running ? "" : " · stopped");
    first = false;
  } catch (e) {
    meta.textContent = "server unreachable";
    dot.className = "dot off";
  }
}
tick(); setInterval(tick, 5000);
</script>
